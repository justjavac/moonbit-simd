name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Libraries to measure
        type: choice
        default: all
        options:
          - all
          - base64
          - atoi
          - argminmax
          - crc32
          - url
          - utf8
          - uuid
          - ryu
          - memchr
          - wc
          - bytecount
  push:
    branches: [main]
    paths:
      - "moon.work"
      - "**/*.mbt"
      - "**/moon.mod"
      - "**/moon.pkg"
      - "benchmarks/moon.work"
      # Report rendering is checked by CI; workflow-only edits use workflow_dispatch.
      - "scripts/benchmark.mbtx"
      - "scripts/benchmark_matrix.mbtx"
      - ".github/actions/setup-moonbit/action.yml"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select benchmark libraries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: nightly
      - name: Update the Mooncakes index
        run: moon update
      - name: Select changed libraries or the manual scope
        id: matrix
        env:
          BENCHMARK_EVENT: ${{ github.event_name }}
          BENCHMARK_BASE: ${{ github.event.before }}
          BENCHMARK_SCOPE: ${{ inputs.scope || 'all' }}
        run: moon run scripts/benchmark_matrix.mbtx

  measure:
    name: Measure (${{ matrix.library }}/${{ matrix.flag }})
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BENCHMARK_RUNNER_LABEL: ${{ matrix.os }}
      BENCHMARK_SCOPE: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare the Windows native compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: nightly
      - name: Update the Mooncakes index
        run: moon update
      - name: Verify correctness before measuring
        run: moon -C benchmarks test --target all
      - name: Measure one library on all backends sequentially
        run: moon run scripts/benchmark.mbtx
      - name: Preserve complete measurements and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-raw-${{ matrix.library }}-${{ matrix.flag }}
          path: _build/benchmarks/
          retention-days: 90
          if-no-files-found: warn

  report:
    name: Generate module reports
    needs: [plan, measure]
    if: needs.plan.outputs.has_work == 'true' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: nightly
      - name: Collect the selected library and operating-system artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-raw-*
          path: _build/benchmarks/
          merge-multiple: true
      - name: Validate and render the complete reports
        run: moon run scripts/benchmark_report.mbtx _build/benchmarks _build/benchmark-report
      - name: Publish BENCHMARK.md and complete JSON snapshots
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: _build/benchmark-report/
          retention-days: 90
          if-no-files-found: error
