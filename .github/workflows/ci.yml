name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and cover (${{ matrix.flag }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: linux
          # The official MoonBit macOS toolchain requires ARM64; pin the maintained image.
          - os: macos-15
            flag: macos
          - os: windows-latest
            flag: windows
    env:
      # The SIMD API is experimental; toolchain versions are recorded in the logs.
      MOONBIT_INSTALL_VERSION: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for the JavaScript backend
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up the native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: nightly

      - name: Record toolchain versions
        run: moon version --all

      - name: Update the Mooncakes index
        run: moon update

      - name: Check all supported backends
        run: moon check --target all --deny-warn

      - name: Generate public interfaces
        run: moon info

      - name: Format MoonBit sources
        run: moon fmt

      - name: Check benchmark automation formatting
        run: moon fmt --check scripts/benchmark.mbtx scripts/benchmark_matrix.mbtx scripts/benchmark_report.mbtx scripts/coverage_report.mbtx scripts/url_fixtures.mbtx scripts/url_oracle.mbtx scripts/utf8_oracle.mbtx scripts/atoi_oracle.mbtx scripts/ryu_tables.mbtx scripts/ryu_oracle.mbtx scripts/ryu_benchmark_report.mbtx scripts/memchr_fixtures.mbtx scripts/memchr_benchmark_report.mbtx

      - name: Check comparison module
        run: moon -C benchmarks check --target all --deny-warn

      - name: Check comparison module formatting
        run: moon -C benchmarks fmt --check

      - name: Verify comparison adapters
        run: moon -C benchmarks test --target all

      - name: Test benchmark report validation
        run: moon run scripts/benchmark_report.mbtx --self-test

      - name: Test benchmark collector inventories
        run: moon run scripts/benchmark.mbtx --self-test

      - name: Test benchmark matrix planning
        run: moon run scripts/benchmark_matrix.mbtx --self-test

      - name: Verify generated and formatted files
        run: git diff --exit-code

      - name: Test all supported backends
        run: moon test --target all

      - name: Test native with coverage
        run: moon test --target native --enable-coverage

      - name: Generate filtered native Cobertura reports
        run: moon run scripts/coverage_report.mbtx ${{ matrix.flag }} crc32 url utf8 base64 atoi argminmax uuid ryu memchr wc bytecount

      - name: Save the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.flag }}
          path: |
            coverage-crc32-${{ matrix.flag }}.xml
            coverage-url-${{ matrix.flag }}.xml
            coverage-utf8-${{ matrix.flag }}.xml
            coverage-base64-${{ matrix.flag }}.xml
            coverage-atoi-${{ matrix.flag }}.xml
            coverage-argminmax-${{ matrix.flag }}.xml
            coverage-uuid-${{ matrix.flag }}.xml
            coverage-ryu-${{ matrix.flag }}.xml
            coverage-memchr-${{ matrix.flag }}.xml
            coverage-memchr-memmem-${{ matrix.flag }}.xml
            coverage-wc-${{ matrix.flag }}.xml
            coverage-bytecount-${{ matrix.flag }}.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage-crc32-${{ matrix.flag }}.xml,coverage-url-${{ matrix.flag }}.xml,coverage-utf8-${{ matrix.flag }}.xml,coverage-base64-${{ matrix.flag }}.xml,coverage-atoi-${{ matrix.flag }}.xml,coverage-argminmax-${{ matrix.flag }}.xml,coverage-uuid-${{ matrix.flag }}.xml,coverage-ryu-${{ matrix.flag }}.xml,coverage-memchr-${{ matrix.flag }}.xml,coverage-memchr-memmem-${{ matrix.flag }}.xml,coverage-wc-${{ matrix.flag }}.xml,coverage-bytecount-${{ matrix.flag }}.xml
          flags: ${{ matrix.flag }}
          name: workspace-${{ matrix.flag }}
          disable_search: true
          fail_ci_if_error: true
